<div class="mw-content-ltr mw-parser-output" lang="en" dir="ltr"><p>The <b>UNL-NL dictionaries</b> are bilingual dictionaries linking <a href="/wiki/Universal_Words" title="Universal Words">UWs</a> to natural language (NL) words. They can be unidirectional (UNL-to-NL or NL-to-UNL) or bidirectional (NL-to-UNL-to-NL). UNL-to-NL dictionaries are used for <a href="/wiki/Deconversion" class="mw-redirect" title="Deconversion">deconversion</a>, while NL-to-UNL are used for <a href="/wiki/Enconversion" class="mw-redirect" title="Enconversion">enconversion</a>.
</p>
