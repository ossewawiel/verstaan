# archive: none for eng. Every record below is project-written (issues 195, 198 and 199):
# source.archive_path "original" marks it, and source.line names the archive rule it adapts.
- id: "1"
  kind: disambiguation
  lhs: "([in],^POS=PRE)(POS=ART,#PREFERRED)"
  rhs: "0"
  conditions: []
  comment: "Strikes every reading of in but the preposition when an article follows, as in A07 a book in a box; the article keeps its readings"
  source: {archive_path: original, line: "issue 195; adapted from exports/ger/49.dgrammar.txt line 14 and wiki/D-rule.wikitext line 155"}
- id: "2"
  kind: disambiguation
  lhs: "([on],^POS=PRE)(POS=ART,#PREFERRED)"
  rhs: "0"
  conditions: []
  comment: "Strikes every reading of on but the preposition when an article follows, as in A15 on the table; the article keeps its readings"
  source: {archive_path: original, line: "issue 195; adapted from exports/ger/49.dgrammar.txt line 14 and wiki/D-rule.wikitext line 155"}
- id: "3"
  kind: disambiguation
  lhs: "([about],^POS=PRE)(POS=ART,#PREFERRED)"
  rhs: "0"
  conditions: []
  comment: "Strikes every reading of about but the preposition when an article follows, as in A15 about the city; the article keeps its readings"
  source: {archive_path: original, line: "issue 195; adapted from exports/ger/49.dgrammar.txt line 14 and wiki/D-rule.wikitext line 155"}
- id: "4"
  kind: disambiguation
  lhs: "([about],^POS=PRE)(^LEX,^[.],^[,],^[!],^[?],^[;],^[:])"
  rhs: "0"
  conditions: []
  comment: "Strikes every reading of about but the preposition when a word the dictionary does not hold follows, as in A09 about Geneva; a punctuation mark does not count"
  source: {archive_path: original, line: "issue 195; adapted from exports/ger/49.dgrammar.txt line 14 and wiki/English_Disambiguation_Grammar.wikitext line 21"}
- id: "5"
  kind: disambiguation
  lhs: "([in],^rel=plc)(D,#PREFERRED)(N,{SEM=ARF|SEM=LCT},#PREFERRED)"
  rhs: "0"
  conditions: []
  comment: "Strikes every reading of in but the place readings when a determiner and a noun with an artefact or location reading follow, as in A07 a book in a box; the determiner and the noun keep their readings"
  source: {archive_path: original, line: "issue 198; adapted from exports/afr/44.dgrammar.txt line 17 and exports/slv/72.dgrammar.txt line 13"}
- id: "6"
  kind: disambiguation
  lhs: "([all],^att=@all)(D,#PREFERRED)"
  rhs: "0"
  conditions: []
  comment: "Strikes every reading of all but the @all quantifier when a determiner follows, as in A06 all the books; the determiner keeps its readings"
  source: {archive_path: original, line: "issue 199; adapted from exports/afr/44.dgrammar.txt line 18, an intensifier does not stand before a noun phrase, and exports/ger/49.dgrammar.txt line 14"}
- id: "7"
  kind: disambiguation
  lhs: "([some],^att=@paucal)(N,#PREFERRED)"
  rhs: "0"
  conditions: []
  comment: "Strikes every reading of some but the @paucal quantifier when a noun follows, as in A10 some days; the noun keeps its readings"
  source: {archive_path: original, line: "issue 199; adapted from exports/afr/44.dgrammar.txt line 18, (A,SAV)(BLK)(N)=0, with @paucal from ugoa1 lines 77 and 422 to 434"}
- id: "8"
  kind: disambiguation
  lhs: "([before],^rel=tim)(D,#PREFERRED)(N,SEM=TIM,#PREFERRED)"
  rhs: "0"
  conditions: []
  comment: "Strikes every reading of before but the time readings when a determiner and a noun with a time reading follow, as in A10 before the summer; the determiner and the noun keep their readings"
  source: {archive_path: original, line: "issue 199; adapted from exports/afr/44.dgrammar.txt line 15, (P,rel=plc)(BLK)(D)(BLK)(N,SEM=TIM)=0, in the shape of rule 5"}
- id: "9"
  kind: disambiguation
  lhs: "([very],^att=@plus)(J,#PREFERRED)"
  rhs: "0"
  conditions: []
  comment: "Strikes every reading of very but the @plus intensifier when an adjective follows, as in A12 a very beautiful car; the adjective keeps its readings"
  source: {archive_path: original, line: "issue 199; adapted from grammars/eng_unl_tgrammar.txt line 57, very.@plus beautiful > beautiful.@plus"}
- id: "10"
  kind: disambiguation
  lhs: "(D,#PREFERRED)(N,^CAR)"
  rhs: "0"
  conditions: []
  comment: "Strikes every noun reading with no cardinality after a determiner, as in A07 a box and A10 the summer; the determiner keeps its readings"
  source: {archive_path: original, line: "issue 199; no archive D-rule reads CAR; wiki/Tagset.wikitext line 77 defines CAR=CTB, countable"}
