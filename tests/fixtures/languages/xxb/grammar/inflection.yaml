# SPEC.md §4 header adapted: these records are original, so no data/archive/manifest.jsonl
# line exists to point at.
# One record per paradigm. The id is the PAR value of the words that take it; the engine adds
# `<iso3>-inf-` in the trace.
#   PLR:=0>"ki";       for this feature value, replace 0 trailing letters with ki
# Only generation runs a paradigm: `!FLX` in a generation rule applies it, left to right.
# The engine has no reverse inflection. Analysis finds a word form such as `hundon` as its own
# dictionary entry, which carries `BF` (the base form) and `DEF: Y`, and an analysis rule turns
# that feature into an attribute. Do not delete the form entries as redundant: without them
# the word is unknown.
- id: "M1"
  kind: inflection
  lhs: ""
  rhs: "DEF:=0>\"n\";"
  conditions: []
  comment: "Adds n to a definite noun."
  source: original
