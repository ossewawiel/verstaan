# SPEC.md §4 header adapted: these records are original, so no data/archive/manifest.jsonl
# line exists to point at.
# Notation. The engine's rule syntax (docs/unl-reference/formats/transformation-grammar.md).
#   rel(%x;%y)         a relation in the graph, matched by name
#   (%x,N,@pl)         a node with these tags and attributes
#   (%y)(%x)           the tokens, written left to right
#   NS(%x,-@pl;%y,...) a noun phrase node: drops @pl from the head, adds a function word
#   !FLX               runs the word's paradigm from grammar/inflection.yaml
# Rules apply in file order, the first match wins. The id is bare: the engine adds
# `<iso3>-gen-` in the trace.
- id: "04"
  kind: generation
  lhs: "(%x,N,@pl)"
  rhs: "(NS(%x,-@pl;%y,[mo],+LEX=D),+LEX=N)"
  conditions: []
  comment: "Hangs the plural particle on a noun."
  source: original
- id: "05"
  kind: generation
  lhs: "(%x,V,@past)"
  rhs: "(VS(%x,-@past;%y,[da],+LEX=D),+LEX=V)"
  conditions: []
  comment: "Hangs the past particle on a verb."
  source: original
- id: "02"
  kind: generation
  lhs: "(%x,N,@def)"
  rhs: "(%x,-@def,+DEF)"
  conditions: []
  comment: "Sets a definite noun for its suffix."
  source: original
- id: "06"
  kind: generation
  lhs: "NS(%x;%y)"
  rhs: "(%y)(%x)"
  conditions: []
  comment: "Writes the plural particle in front of its noun."
  source: original
- id: "07"
  kind: generation
  lhs: "VS(%x;%y)"
  rhs: "(%y)(%x)"
  conditions: []
  comment: "Writes the past particle in front of its verb."
  source: original
- id: "03"
  kind: generation
  lhs: "mod(%x;%y)"
  rhs: "(%x)(%y)"
  conditions: []
  comment: "Writes an adjective after its noun."
  source: original
- id: "08"
  kind: generation
  lhs: "obj(%x;%y)"
  rhs: "(%y)(%x)"
  conditions: []
  comment: "Writes the object in front of the verb."
  source: original
- id: "01"
  kind: generation
  lhs: "agt(%x;%y)"
  rhs: "(%y)(%x)"
  conditions: []
  comment: "Writes the agent in front of the object and the verb."
  source: original
- id: "09"
  kind: generation
  lhs: "(%x,^inflected,FLX)"
  rhs: "(%x,!FLX,+inflected)"
  conditions: []
  comment: "Runs a word's paradigm once."
  source: original
- id: "10"
  kind: generation
  lhs: "((%x)(%y)(%z)(%w))"
  rhs: "(%x)(%y)(%z)(%w)"
  conditions: []
  comment: "Flattens a four-word span into the list."
  source: original
- id: "11"
  kind: generation
  lhs: "((%x)(%y)(%z))"
  rhs: "(%x)(%y)(%z)"
  conditions: []
  comment: "Flattens a three-word span into the list."
  source: original
- id: "12"
  kind: generation
  lhs: "((%x)(%y))"
  rhs: "(%x)(%y)"
  conditions: []
  comment: "Flattens a two-word span into the list."
  source: original
