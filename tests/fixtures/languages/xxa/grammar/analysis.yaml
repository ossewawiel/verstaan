# SPEC.md §4 header adapted: these records are original, so no data/archive/manifest.jsonl
# line exists to point at.
# Notation. The engine's rule syntax (docs/unl-reference/formats/transformation-grammar.md).
#   (N,%s)(V,%v)       a window of tokens; a tag tests a feature key, value or attribute
#   ^TAG               the tag must be absent
#   %x                 binds the token's position to the name x for the right side
#   {N|^LEX}           a disjunction: any one alternative matches
#   +att=@pl           put the attribute @pl on the node
#   rel(%a;%b)         a relation from node a to node b
# Rules apply in file order. No inflection rule runs before them: the engine has no reverse
# inflection. A word form such as `kanoki` is its own dictionary entry, with `BF` and `NUM: PLR`,
# so the tokens reaching these rules already carry the feature that marks the form.
# The id of an analysis rule is its qualified name, because the engine writes it to the trace as is.
- id: "xxa-ana-04"
  kind: analysis
  lhs: "(N,PLR,^@pl)"
  rhs: "(+att=@pl)"
  conditions: []
  comment: "Marks a plural noun form with @pl."
  source: original
- id: "xxa-ana-05"
  kind: analysis
  lhs: "(V,PST,^@past)"
  rhs: "(+att=@past)"
  conditions: []
  comment: "Marks a past verb form with @past."
  source: original
- id: "xxa-ana-02"
  kind: analysis
  lhs: "(D,att,%d)(N,%n)"
  rhs: "(%n,+att=%d)"
  conditions: []
  comment: "Moves a function word's attribute onto the noun after it and drops the word."
  source: original
- id: "xxa-ana-03"
  kind: analysis
  lhs: "(J,%j)(N,%n)"
  rhs: "(%n,mod(%n;%j))"
  conditions: []
  comment: "Hangs an adjective on the noun after it."
  source: original
- id: "xxa-ana-01"
  kind: analysis
  lhs: "(N,%s)(V,%v)({N|^LEX,^STAIL},%o)"
  rhs: "(%v,agt(%v;%s),obj(%v;%o))"
  conditions: []
  comment: "Takes the noun before the verb as agent and the word after it as object."
  source: original
