# The atlas (ADR 0015). Hand-authored, never generated: fix a position here, not in a script.
# Regions are PLAN.md Section 7's milestones; one tile per issue-number prefix under
# docs/factory/issues/. tools/factory/validate_map.py checks prefix and tile match one to one.
# Tile state (lit, cleared for jump, contact, fogged) is computed by the console, never stored
# here. Schema: SPEC.md Section 3.7.
#
# Eight regions, one per PLAN.md Section 7 milestone row (M0-M7): ADR 0015 says "seven",
# written before the M7 row existed; SPEC.md Section 3.7 carries the correction. m6 (Growth,
# issues 39-44) has no tiles yet and stays fogged -- the factory/console infrastructure that
# built toward the console-as-CIC line sits under m7 instead, alongside the milestone's own
# 172-178, so a real M6 issue landing later does not appear inside an already-lit region.
#
# Laid out 4 across, 2 down (not one long row): a canvas close to square renders far more
# legibly than a 9840-wide, 1200-tall strip (checkpoint-4 finding: real on-screen tile size).
regions:
- id: m0
  name: M0 Foundation
  goal: Repo, licences, factory, CMake and Python skeletons, gates proven to fail.
  x: 0
  y: 0
  size: 1200
- id: m1
  name: M1 Mirror
  goal: Every language exported, manifest complete, UNL reference corpus readable by agents, inventory
    report.
  x: 1440
  y: 0
  size: 1200
- id: m2
  name: M2 Store
  goal: Canonical data model; importer for dictionaries, grammars, tagset, corpora; validator.
  x: 2880
  y: 0
  size: 1200
- id: m3
  name: M3 Engine slice
  goal: Tokeniser, dictionary lookup, rule interpreter on runtime tables, English to UNL to Afrikaans
    for a fixed sentence set, golden tests.
  x: 4320
  y: 0
  size: 1200
- id: m4
  name: M4 Compiler and tiers
  goal: Generated tables per tier, equivalence tests, basic tier cross-built and run on a Pi Zero, Argos
    benchmark beside it.
  x: 0
  y: 1440
  size: 1200
- id: m5
  name: M5 Applications
  goal: CLI translator, register and context selection, first desktop shell.
  x: 1440
  y: 1440
  size: 1200
- id: m6
  name: M6 Growth
  goal: Rule-author workflow for Afrikaans grammar growth, Dutch seeded from German and English references,
    CLA check, project site.
  x: 2880
  y: 1440
  size: 1200
- id: m7
  name: M7 Console CIC
  goal: Bridge that lands, staged flight deck, ship-systems room, codex and debrief, hand-drawn atlas
    with fog of war, console as Agent SDK harness (ADR 0014-0016), plus the factory/console infrastructure
    side quests that built toward it.
  x: 4320
  y: 1440
  size: 1200
