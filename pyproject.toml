[project]
name = "verstaan-tools"
version = "0.0.0"
requires-python = ">=3.13"
description = "Python tooling that builds the data and the generated code. Not on the translation path."
# jsonschema: tools/validate/tests/test_schema.py validates the three schema files against worked
# examples with it (issue 13). No other tool package has a third-party dependency yet.
dependencies = ["jsonschema>=4"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
