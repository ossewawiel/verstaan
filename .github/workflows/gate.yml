name: gate

# docs/factory/issues/91-source-control-and-ci.md: runs the /gate steps that exist today
# (.claude/commands/gate.md) on every pull request and on push to main. Branch protection
# requires the job named `gate` (the aggregator at the bottom of this file), because a matrix
# job's check name carries the matrix values and cannot be named `gate` on its own.
#
# The repository's CMakePresets.json hardcodes compiler paths for the maintainer's own machine
# (see the `clang-release` and `gcc-release` preset descriptions); those presets do not resolve
# on a GitHub-hosted runner. The `ubuntu-latest` legs configure CMake directly instead of through
# a preset, choosing clang++ or g++ explicitly. The `windows-latest` leg uses the `msvc-debug`
# preset, which is portable once `VCPKG_ROOT` points at the runner's pre-installed vcpkg.
#
# Every ctest label runs (not just `fast`), on both the MSVC and the Linux legs. clang-tidy runs
# too, but not via the `clang-release` preset -- it cannot resolve here for the reason above --
# instead directly against the Linux clang leg's own compile_commands.json. Two /gate steps stay
# unrunnable pre-M4 and say so where they would run: step 5's `-L equivalence`/`-L tier` via
# `clang-release` (already exercised without that filter by the full ctest run) and step 6's
# regenerate-and-diff (`tools.compiler` has no `--all-tiers` flag yet).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # /gate step 0 (stubs) and step 1 (format, secrets).
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python tooling
        run: pip install ruff pytest pyyaml

      - name: Step 0 -- no stub left outside tests/
        shell: bash
        run: |
          # engine/include/verstaan/engine.hpp is excluded: it declares Status::not_implemented as
          # a permanent enum member, the M0 stub value every real Engine::translate call retires
          # (SPEC.md §3.4) -- not an unfinished stub to flag.
          hits=$(grep -rn 'not_implemented\|NotImplementedError' engine/src engine/include tools/ \
            --include=*.cpp --include=*.hpp --include=*.py 2>/dev/null \
            | grep -v '/tests/' | grep -v 'engine/include/verstaan/engine.hpp' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a stub was left outside tests/ -- an issue was closed on a stub"
            exit 1
          fi

      - name: Step 1 -- no committed GitHub token
        shell: bash
        run: |
          # Real tokens, not the bare prefixes: a classic PAT is ghp_ + 36 chars, a fine-grained
          # one is github_pat_ + 22+ chars. This is why prose that only mentions the prefix (this
          # file, the issue file, CLA docs) never trips the check. No path is excluded: a live
          # token pasted anywhere, including this file, must still be caught.
          if git grep -nIE '\bghp_[A-Za-z0-9]{36}\b|\bgithub_pat_[A-Za-z0-9_]{22,}\b' -- .; then
            echo "::error::a GitHub token pattern was found committed in the repository"
            exit 1
          fi

      - name: Step 1 -- no committed UNL_PASS credential
        shell: bash
        run: |
          # A real assignment, not the bare env var name. The assignment must start the line
          # (bare or after 'export'), which is what keeps prose out: this file's own comments,
          # .claude/commands/gate.md and the issue files all mention UNL_PASS= mid-sentence and
          # none of them trip it. A value beginning with '$' is skipped too, so UNL_PASS=${UNL_PASS}
          # and UNL_PASS: ${{ secrets.UNL_PASS }} read as references, not leaks. tests/ is
          # excluded: tools/mirror/tests/test_cli.py legitimately constructs UNL_PASS=hunter2 to
          # prove the CLI refuses it as an argument (issue 5); a real leak outside tests/ still
          # gets caught. Known gap: an assignment buried mid-line inside a longer command --
          # catching that would flag every file that documents this check.
          if git grep -nIE '^[[:space:]]*(export[[:space:]]+)?UNL_PASS[[:space:]]*[:=][[:space:]]*["'"'"']?[^[:space:]$"'"'"'][^[:space:]]{3,}' -- . ':(exclude)**/tests/**'; then
            echo "::error::an UNL_PASS credential value was found committed in the repository"
            exit 1
          fi

      - name: Step 1 -- clang-format
        shell: bash
        run: |
          files=$(git ls-files 'engine/**/*.cpp' 'engine/**/*.hpp' 'apps/**/*.cpp' 'apps/**/*.hpp')
          [ -z "$files" ] && exit 0
          clang-format --dry-run --Werror $files

      - name: Step 1 -- ruff format and lint
        run: |
          ruff format --check tools/
          ruff check tools/

      - name: Step 1 -- python -m tools.validate --licences
        shell: bash
        run: |
          if [ -d tools/validate ]; then
            python -m tools.validate --licences
          else
            echo "tools/validate does not exist yet (issue 3) -- skipping"
          fi

  # /gate step 2 (build every preset that applies) and step 3 (tests, pytest, validate).
  build:
    name: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
          - os: ubuntu-latest
            compiler: clang
          - os: ubuntu-latest
            compiler: gcc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python tooling
        run: pip install ruff pytest pyyaml

      # Issue 95's acceptance criteria promise Node 20 or later. The runner image ships some
      # Node already, but that version is whatever the image happens to carry, not a pin -- so
      # setup-node here is what actually keeps that promise, on all three matrix legs.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Point VCPKG_ROOT at the runner's pre-installed vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Cache vcpkg binaries
        if: hashFiles('vcpkg.json') != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ matrix.os }}-${{ matrix.compiler }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure and build (MSVC)
        if: matrix.compiler == 'msvc' && hashFiles('CMakePresets.json') != ''
        shell: pwsh
        run: |
          cmake --preset msvc-debug
          cmake --build --preset msvc-debug

      # /gate step 3 runs every label, not just `fast`: gate.md's `ctest --preset <p>
      # --output-on-failure` carries no `-L` filter. This is the one preset that resolves on a
      # hosted runner (CMakePresets.json's msvc-debug hardcodes nothing machine-specific once
      # VCPKG_ROOT is set), so it is the leg that runs the golden/equivalence/tier placeholder
      # tests (tests/CMakeLists.txt) alongside `fast`, not just `fast` alone.
      - name: Test (MSVC, every ctest label)
        if: matrix.compiler == 'msvc' && hashFiles('CMakePresets.json') != ''
        shell: pwsh
        run: ctest --preset msvc-debug --output-on-failure

      - name: Install ninja (Linux)
        if: runner.os == 'Linux' && hashFiles('CMakeLists.txt') != ''
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # CMAKE_EXPORT_COMPILE_COMMANDS is only needed on the clang leg, which is also the one that
      # runs clang-tidy below (compile_commands.json is what `-p` reads); harmless to export on
      # both, so the flag stays unconditional to keep the two legs' configure step identical.
      - name: Configure and build (clang/gcc)
        if: runner.os == 'Linux' && hashFiles('CMakeLists.txt') != ''
        shell: bash
        env:
          CXX_COMPILER: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX_COMPILER" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/ci

      # --no-tests=error mirrors the MSVC preset's "noTestsAction": "error" (CMakePresets.json):
      # a Linux leg that builds but has zero tests must fail loudly, not exit 0. No `-L` filter,
      # matching /gate step 3: this runs every label, including the golden/equivalence/tier
      # placeholders (tests/CMakeLists.txt), not just `fast`.
      - name: Test (clang/gcc, every ctest label)
        if: runner.os == 'Linux' && hashFiles('CMakeLists.txt') != ''
        shell: bash
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error

      # /gate step 4, clang-tidy. The clang-release preset that /gate uses locally hardcodes the
      # maintainer's own machine (CMakePresets.json's description field: a Windows LLVM path and
      # a GnuWin32 make.exe path), so it cannot run via that preset on any hosted runner -- the
      # file header above explains why the Linux legs configure CMake directly instead of through
      # a preset. That same direct configure is what makes tidy runnable for real here: it already
      # exports compile_commands.json (CMAKE_EXPORT_COMPILE_COMMANDS above), and ubuntu-latest
      # ships clang-tidy, so this leg (clang only -- gcc's compile_commands.json would mismatch
      # clang-tidy's parser) runs it directly against that database instead of a preset.
      - name: clang-tidy
        if: runner.os == 'Linux' && matrix.compiler == 'clang' && hashFiles('CMakeLists.txt') != ''
        shell: bash
        run: |
          files=$(git ls-files 'engine/**/*.cpp')
          [ -z "$files" ] && { echo "no engine/**/*.cpp yet -- skipping"; exit 0; }
          clang-tidy -p build/ci $files

      # /gate step 5, equivalence and tiers (M4 onward). tests/CMakeLists.txt already registers
      # `equivalence` and `tier`-labelled placeholder tests, and the label-less ctest run above
      # already executes them on every leg -- there is no separate `-L equivalence`/`-L tier` run
      # to add here. The clang-release-specific invocation gate.md names cannot run on a hosted
      # runner for the same hardcoded-path reason as clang-tidy above; once M4 lands real
      # equivalence/tier content, it is exercised by this same label-less run, no new step needed.

      # /gate step 6, regenerate. `python -m tools.compiler` has no `--all-tiers` flag yet (M4 has
      # not landed: tools/compiler/cli.py only takes --version today), so the regenerate-and-diff
      # check cannot run for real yet. Once M4 adds the flag, add
      # `python -m tools.compiler --all-tiers && git diff --exit-code engine/generated/` here.
      - name: Regenerate and diff (M4 onward)
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        shell: bash
        run: echo "tools.compiler --all-tiers does not exist yet (M4) -- skipping the regenerate-and-diff check"

      # CMakePresets.json only gates the MSVC leg (it is the only one that reads presets; the
      # comment at the top of this file explains why Linux configures CMake directly instead).
      # CMakeLists.txt is what actually gates whether there is a real CMake project to build at
      # all, on any OS, so that is the signal both "no build system yet" messages use -- not a
      # file neither Linux leg touches.
      - name: No build system yet (MSVC)
        if: matrix.compiler == 'msvc' && hashFiles('CMakePresets.json') == ''
        shell: pwsh
        run: echo "CMakePresets.json does not exist on this ref yet (issue 2) -- skipping build and ctest"

      - name: No build system yet (Linux)
        if: runner.os == 'Linux' && hashFiles('CMakeLists.txt') == ''
        shell: bash
        run: echo "CMakeLists.txt does not exist on this ref yet (issue 2) -- skipping build and ctest"

      - name: pytest
        shell: bash
        run: |
          if git ls-files 'tools/**/test_*.py' 'tools/**/*_test.py' | grep -q .; then
            python -m pytest tools/ -q
          else
            echo "no Python tests exist on this ref yet -- skipping pytest"
          fi

      - name: Step 3 -- console tests (node, zero dependencies)
        shell: bash
        run: |
          if [ -f tools/console/test/run.mjs ]; then
            node tools/console/test/run.mjs
          else
            echo "tools/console/test/run.mjs does not exist on this ref -- skipping"
          fi

      - name: Validate changed/all data
        shell: bash
        run: |
          if [ -d tools/validate ]; then
            python -m tools.validate --all
          else
            echo "tools/validate does not exist yet (issue 3) -- skipping"
          fi

  # docs/factory/issues/91-source-control-and-ci.md: the mirror is the only thing that keeps
  # GitHub issues in step with docs/factory/issues/*.md; this job is what notices when something
  # closed a GitHub issue by hand, or a local file's close didn't get mirrored. It reports drift,
  # it does not fix it (that is `tools/factory/mirror_github.py` without `--check`, run by
  # `.claude/skills/factory-run/SKILL.md` after every close), and it does not gate the merge --
  # `GH_TOKEN` here is the read-only, per-run `GITHUB_TOKEN`, which cannot always see a fork's
  # base repo correctly, so a false positive here must not block a PR.
  mirror-check:
    name: mirror-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python tooling
        run: pip install pyyaml

      - name: Report drift between docs/factory/issues/*.md and GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f tools/factory/mirror_github.py ]; then
            python -m tools.factory.mirror_github --check --repo ${{ github.repository }}
          else
            echo "tools/factory/mirror_github.py does not exist on this ref yet -- skipping"
          fi

  # A pull request from anyone but the owner must have every commit author's email in
  # CONTRIBUTORS.md (docs: CLA.md, issue 91). Skipped entirely for the owner's own PRs.
  cla:
    name: cla
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit author must have signed the CLA
        shell: bash
        run: |
          missing=0
          emails=$(git log --format='%ae' \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            | sort -u)
          for email in $emails; do
            if ! grep -qF "<$email>" CONTRIBUTORS.md; then
              echo "::error::$email has not signed the CLA. Read CLA.md, then add a line to CONTRIBUTORS.md in this PR."
              missing=1
            fi
          done
          exit $missing

  # The check branch protection requires. A matrix job's check name carries its matrix values, so
  # this separate, un-matrixed job is the one that is actually named `gate`.
  gate:
    name: gate
    needs: [lint, build, cla]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required steps passed
        shell: bash
        run: |
          fail=0
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::lint failed"; fail=1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::build failed"; fail=1
          fi
          if [ "${{ needs.cla.result }}" != "success" ] && [ "${{ needs.cla.result }}" != "skipped" ]; then
            echo "::error::cla failed"; fail=1
          fi
          exit $fail
