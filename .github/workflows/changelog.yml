name: changelog

# docs/factory/issues/91-source-control-and-ci.md: CHANGELOG.md is generated, not hand-maintained.
# Runs on every `v*` tag push and regenerates the file from conventional commits. `main` rejects
# direct pushes (branch protection, issue 91), so this opens a pull request instead of pushing;
# the owner merges it like any other PR.
#
# docs/factory/issues/94-ci-parity-github-is-the-merge-path.md: a PR authored with the default
# `secrets.GITHUB_TOKEN` never triggers other workflows -- GitHub Actions refuses to chain
# workflow runs off a GITHUB_TOKEN-authored event, to stop recursive workflow loops. `main`'s
# branch protection requires the `gate` check, so a GITHUB_TOKEN-authored PR could never satisfy
# it and could never merge. `secrets.GH_PAT_CHANGELOG` is a personal access token (repo scope,
# stored as a repository secret) that authors the PR as a real actor instead, so `gate` runs on
# it like any other PR. Create it once under Settings > Secrets and variables > Actions.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4
        with:
          config: .github/cliff.toml
          args: --tag ${{ github.ref_name }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Open a pull request with the regenerated changelog
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          # GH_PAT_CHANGELOG, not GITHUB_TOKEN: see the file header. A GITHUB_TOKEN-authored PR
          # never triggers `gate`, and `main` requires `gate` to merge.
          token: ${{ secrets.GH_PAT_CHANGELOG }}
          commit-message: "docs: regenerate CHANGELOG.md for ${{ github.ref_name }}"
          title: "docs: regenerate CHANGELOG.md for ${{ github.ref_name }}"
          body: |
            Regenerated by `.github/workflows/changelog.yml` (git-cliff) after the tag
            `${{ github.ref_name }}` was pushed. Not hand-edited; see `.github/cliff.toml`.
          branch: "changelog/${{ github.ref_name }}"
          base: main
          add-paths: CHANGELOG.md
