name: changelog

# docs/factory/issues/91-source-control-and-ci.md: CHANGELOG.md is generated, not hand-maintained.
# Runs on every `v*` tag push and regenerates the file from conventional commits. `main` rejects
# direct pushes (branch protection, issue 91), so this opens a pull request instead of pushing;
# the owner merges it like any other PR.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --tag ${{ github.ref_name }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Open a pull request with the regenerated changelog
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: regenerate CHANGELOG.md for ${{ github.ref_name }}"
          title: "docs: regenerate CHANGELOG.md for ${{ github.ref_name }}"
          body: |
            Regenerated by `.github/workflows/changelog.yml` (git-cliff) after the tag
            `${{ github.ref_name }}` was pushed. Not hand-edited; see `.github/cliff.toml`.
          branch: "changelog/${{ github.ref_name }}"
          base: main
          add-paths: CHANGELOG.md
