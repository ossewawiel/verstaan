# git-cliff config (docs/factory/issues/91-source-control-and-ci.md).
# CHANGELOG.md is regenerated by .github/workflows/changelog.yml on every `v*` tag push.
# Never hand-edit CHANGELOG.md: fix a commit message or this file instead.

[changelog]
header = """
# Changelog

All notable changes to Verstaan. Generated by git-cliff from conventional commit messages; do
not edit by hand.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }} \
({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}\n\
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^data", group = "Data" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore\\(#\\d+\\): close", skip = true },
  { message = "^chore: refresh STATE.md", skip = true },
  { message = "^chore", group = "Chores" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Tests" },
  { message = "^refactor", group = "Refactoring" },
]
